name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_wheels:
    name: Build Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Build Wheels (Maturin)
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          sccache: 'true'
          # Ensure SIMD is enabled if using specific features
          # env:
          #   RUSTFLAGS: "-C target-cpu=native" 
      
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  build_cli:
    name: Build CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build Binary
        # Explicitly build the Daemon bin
        run: cargo build --release --bin qres_daemon --manifest-path qres_rust/Cargo.toml
      
      - name: Package Artifacts
        shell: bash
        run: |
          mkdir -p bin
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp qres_rust/target/release/qres_daemon.exe bin/qres-daemon-windows.exe
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp qres_rust/target/release/qres_daemon bin/qres-daemon-macos
          else
            cp qres_rust/target/release/qres_daemon bin/qres-daemon-linux
          fi
      
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}
          path: bin/*
  
  build_studio:
    name: Build Studio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: dtolnay/rust-toolchain@stable
      
      # WASM Pre-requisite
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM Core (Pre-requisite for Studio)
        working-directory: ./qres_rust/qres_wasm
        run: wasm-pack build --target web --release

      - name: Install Frontend Deps
        working-directory: qres-studio
        run: npm install
      
      - name: Build Tauri App
        working-directory: qres-studio
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
      
      # Upload Tauri Artifacts (Paths vary by OS)
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: studio-linux
          path: qres-studio/src-tauri/target/release/bundle/deb/*.deb
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: studio-windows
          path: qres-studio/src-tauri/target/release/bundle/msi/*.msi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-latest'
        with:
          name: studio-macos
          path: qres-studio/src-tauri/target/release/bundle/dmg/*.dmg

  release:
    name: Publish Release
    needs: [build_wheels, build_cli, build_studio]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: studio-*
          path: dist
          merge-multiple: true
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: QRES ${{ github.ref_name }} - Singularity Engine
          body_path: docs/releases/RELEASE_NOTES.md
          files: dist/*
          generate_release_notes: true
