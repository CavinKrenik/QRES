name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Create Virtual Environment and Build
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest numpy requests
          maturin develop --release
        # Note: We run everything in one block to keep the 'source' activation alive

      - name: Run Tests
        run: |
          source .venv/bin/activate
          python benchmarks/torture_test.py
