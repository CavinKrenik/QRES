name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  core-engine-test:
    name: Rust Core & SIMD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Formatting
        working-directory: qres_rust
        run: cargo fmt --check

      - name: Clippy Linting
        working-directory: qres_rust
        continue-on-error: true
        run: cargo clippy --workspace -- -D warnings

      - name: Run Core Unit Tests
        working-directory: qres_rust
        run: cargo test --workspace --verbose

      - name: Verify Release Build
        working-directory: qres_rust
        run: cargo build --release --workspace

  integration-test:
    name: Python Integration
    runs-on: ubuntu-latest
    needs: core-engine-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Create Virtual Environment
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip

      - name: Build Python Extension
        run: |
          source .venv/bin/activate
          pip install maturin pytest
          # Install dependencies from pyproject.toml
          pip install .
          cd qres_rust/qres_core
          maturin develop --release --features python

      - name: Run Torture Test
        run: |
          source .venv/bin/activate
          python benchmarks/torture_test.py
      
      - name: Verify Singularity (Battle Royale)
        run: |
          source .venv/bin/activate
          python benchmarks/battle_royale.py --quick

      - name: Run Phase 1 & 2 Verifications (Quantum)
        run: |
          source .venv/bin/activate
          python tests/verify_phase1.py
          python tests/verify_phase2.py
          python tests/test_swarm_broadcast.py
          python tests/test_receiver_unit.py

      - name: Test LLM Predictor (Optional)
        continue-on-error: true
        run: |
          source .venv/bin/activate
          python benchmarks/semantic_bench.py || echo "LLM test skipped"

  studio-test:
    name: GUI Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install Dependencies
        working-directory: qres-studio
        run: |
          npm ci
          npm run check
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI Libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Check Backend
        working-directory: qres-studio/src-tauri
        run: cargo check
