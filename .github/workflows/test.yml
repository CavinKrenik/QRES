name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  core-engine-test:
    name: Rust Core & SIMD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Formatting
        run: cargo fmt --manifest-path qres_rust/Cargo.toml -- --check

      - name: Clippy Linting
        run: cargo clippy --manifest-path qres_rust/Cargo.toml -- -D warnings

      - name: Run Core Unit Tests (Context & Spectral)
        # Runs tests in qres_rust/src/lib.rs, including the new LzMatch checks
        run: cargo test --manifest-path qres_rust/Cargo.toml --verbose

      - name: Verify SIMD Compilation
        # Ensures features compile correctly
        run: cargo build --release --manifest-path qres_rust/Cargo.toml

  integration-test:
    name: Python Integration
    runs-on: ubuntu-latest
    needs: core-engine-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Build Python Extension
        run: |
          pip install maturin pytest numpy
          maturin develop --release

      - name: Run Torture Test
        run: python benchmarks/torture_test.py
      
      - name: Verify Singularity (Battle Royale)
        run: python benchmarks/battle_royale.py --quick

  studio-test:
    name: GUI Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install Dependencies
        working-directory: qres-studio
        run: |
          npm ci
          npm run check
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI Libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Check Backend
        working-directory: qres-studio/src-tauri
        run: cargo check
