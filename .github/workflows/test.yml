name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Create Virtual Environment and Build
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest numpy requests
          export CARGO_BUILD_JOBS=1
          maturin develop --release -v
        # Note: We run everything in one block to keep the 'source' activation alive

      - name: Run Tests
        run: |
          source .venv/bin/activate
          python benchmarks/torture_test.py

  test-studio:
    name: Test Studio (GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        working-directory: qres-studio
        run: npm ci
      - name: Check Svelte
        working-directory: qres-studio
        run: npm run check
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Check Rust Backend
        working-directory: qres-studio/src-tauri
        run: cargo check
