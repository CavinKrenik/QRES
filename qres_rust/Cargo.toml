[package]
name = "qres_rust"
version = "5.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "qres_rust"
crate-type = ["cdylib", "rlib"]

[features]
default = ["swarm"]
python = ["dep:pyo3"]
swarm = [
    "dep:libp2p", "dep:tokio", "dep:axum", "dep:tower-http",
    "dep:sysinfo", "dep:dirs", "dep:starship-battery"
]
gpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
# PyO3 with buffer protocol support (Required for Python Wheel)
pyo3 = { version = "0.20.0", features = ["extension-module", "abi3-py38"], optional = true }

# Entropy Coding Backend (The Main Engine)
constriction = "0.4"
probability = "0.20"

# Math & Data Structure
ndarray = "0.15"
rustfft = "6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1.4"
rayon = "1.8"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }

# GPU Compute (Task 6)
wgpu = { version = "0.19", optional = true }
pollster = { version = "0.3", optional = true }

# Phase 21: Hybrid Architecture & Neural Selection
zstd = "0.13"
candle-core = "0.9.1"
candle-nn = "0.9.1"

# Swarm P2P Dependencies
libp2p = { version = "0.53", features = [
    "tcp", "dns", "websocket", "noise", "yamux", "gossipsub", "kad",
    "identify", "ping", "mdns", "tokio", "macros"
], optional = true }
tokio = { version = "1.36", features = ["full"], optional = true }
axum = { version = "0.7", optional = true }
tower-http = { version = "0.5", features = ["cors", "fs"], optional = true }

# System Metrics for Swarm Health
sysinfo = { version = "0.30", optional = true }
dirs = { version = "5.0", optional = true }
starship-battery = { version = "0.7", optional = true }
crossbeam = "0.8"
rand = "0.8"
glob = "0.3"
walkdir = "2"
sha2 = "0.10"
blake3 = "1.5"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
hex = "0.4"
tempfile = "3.10"

[[bin]]
name = "qres-cli"
path = "src/main.rs"
