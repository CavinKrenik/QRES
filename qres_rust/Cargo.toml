[package]
name = "qres_rust"
version = "1.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "qres_rust"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
# PyO3 with buffer protocol support (Optional for CLI, Required for Python Wheel)
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py38"], optional = true }
# Faster zlib backend using zlib-ng
# Faster zlib backend (switched to default/miniz_oxide to fix Windows build)
flate2 = { version = "1.0" } 
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.8"

# Phase 21: Hybrid Architecture & Neural Selection
zstd = "0.13"
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[[bin]]
name = "qres-cli"
path = "src/main.rs"