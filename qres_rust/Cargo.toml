[package]
name = "qres_rust"
version = "0.2.0"
edition = "2021"
description = "QRES: Lossless Relational Compression Codec"
authors = ["Cavin Krenik"]

[dependencies]
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
bincode = "1.3"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
rayon = "1.8"

# Future proofing for Python bindings (Phase 2)
# pyo3 = { version = "0.20", features = ["extension-module"], optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"