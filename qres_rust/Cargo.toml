[package]
name = "qres_rust"
version = "3.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "qres_rust"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
# PyO3 with buffer protocol support (Optional for CLI, Required for Python Wheel)
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py38"], optional = true }
# Faster zlib backend using zlib-ng
# Faster zlib backend (switched to default/miniz_oxide to fix Windows build)
# flate2 = { version = "1.0" } # DEPRECATED in v3.0
constriction = "0.4"
ndarray = "0.15"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1.4"
rayon = "1.8"

# Phase 21: Hybrid Architecture & Neural Selection
zstd = "0.13"
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = { version = "0.19", default-features = false, features = ["onig"] }
# Phase 23: Native P2P Swarm
libp2p = { version = "0.53", features = ["gossipsub", "mdns", "noise", "yamux", "tcp", "tokio", "macros", "identify", "kad"] }
sysinfo = "0.30"
dirs = "4.0"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
# Phase 24+: HTTP REST API
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
# Phase 2.1: Configuration
toml = "0.8"
# Phase 2.1-2.3: Logging, Events, Battery
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
starship-battery = "0.8"



[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[[bin]]
name = "qres-cli"
path = "src/main.rs"

[[bin]]
name = "swarm_sim"
path = "../benchmarks/swarm_sim.rs"

[[bin]]
name = "swarm_scale"
path = "../benchmarks/swarm_scale.rs"
