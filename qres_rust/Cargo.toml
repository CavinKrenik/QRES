[package]
name = "qres_rust"
version = "0.3.0"
edition = "2021"

[lib]
name = "qres_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
# PyO3 with buffer protocol support
# Note: abi3-py38 allows the wheel to work on Python 3.8+ without rebuilds
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py38"] }
# Faster zlib backend using zlib-ng
# Faster zlib backend (switched to default/miniz_oxide to fix Windows build)
flate2 = { version = "1.0" } 
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[[bin]]
name = "qres-cli"
path = "src/main.rs"