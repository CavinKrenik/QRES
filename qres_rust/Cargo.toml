[package]
name = "qres_rust"
version = "0.2.1"
edition = "2021"
description = "QRES: Quantum-Relational Encoding System (v2 Alpha)"
authors = ["Cavin Krenik"]

# Crucial: Defines this project as BOTH a library (for Python) and a binary (for CLI)
[lib]
name = "qres_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
flate2 = "1.0"
bincode = "1.3"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
rayon = "1.8"
# Python bindings
pyo3 = { version = "0.20", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"