[package]
name = "qres_rust"
version = "5.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "qres_rust"
crate-type = ["cdylib", "rlib"]

[features]
default = ["swarm"]
python = ["dep:pyo3"]
swarm = [
    "dep:libp2p", "dep:tokio", "dep:axum", "dep:tower-http",
    "dep:sysinfo", "dep:dirs", "dep:starship-battery"
]

[dependencies]
# PyO3 with buffer protocol support (Required for Python Wheel)
pyo3 = { version = "0.20.0", features = ["extension-module", "abi3-py38"], optional = true }

# Entropy Coding Backend (The Main Engine)
constriction = "0.4"
probability = "0.20"

# Math & Data Structure
ndarray = "0.15"
rustfft = "6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1.4"
rayon = "1.8"

# Phase 21: Hybrid Architecture & Neural Selection
zstd = "0.13"
candle-core = "0.9.1"
candle-nn = "0.9.1"

# Archive Format
walkdir = "2.5"
blake3 = "1.5"

tokenizers = { version = "0.19", default-features = false, features = ["onig"] }
clap = { version = "4.0", features = ["derive"] }

# Phase 23: Native P2P Swarm
libp2p = { version = "0.53", features = ["gossipsub", "mdns", "noise", "yamux", "tcp", "tokio", "macros", "identify", "kad"], optional = true }
sysinfo = { version = "0.30", optional = true }
dirs = { version = "4.0", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
rand = "0.8"

# Phase 24+: HTTP REST API
axum = { version = "0.7", optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }

# Phase 2.1: Configuration
toml = "0.8"

# Phase 2.1-2.3: Logging, Events
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
starship-battery = { version = "0.8", optional = true }
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[[bin]]
name = "qres-cli"
path = "src/main.rs"

[[bin]]
name = "swarm_sim"
path = "../benchmarks/swarm_sim.rs"

[[bin]]
name = "swarm_scale"
path = "../benchmarks/swarm_scale.rs"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "criterion_suite"
harness = false
