[package]
name = "qres_core"
version = "12.0.0"
edition = "2021"

[features]
default = ["std"]
std = ["serde/std", "rand/std", "dep:walkdir", "constriction/std"]
python = ["pyo3", "std"]
gpu = []

[lib]
# Required for PyO3 when building Python extension
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
rand = { version = "0.8", default-features = false }
lazy_static = { version = "1.4", features = ["spin_no_std"] }
constriction = { version = "0.3", default-features = false }
rustfft = "6.2"
probability = "0.20"
walkdir = { version = "2.3", optional = true }
blake3 = { version = "1.5", default-features = false }
libm = "0.2"
wide = "0.7"
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
pyo3 = { version = "0.22", optional = true, features = ["abi3-py38", "extension-module"] }
