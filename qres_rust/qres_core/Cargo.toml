[package]
name = "qres_core"
version = "0.10.0"
edition = "2021"

[features]
default = []
python = ["pyo3"]
gpu = []

[lib]
# Required for PyO3 when building Python extension
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
zstd = { workspace = true }
lazy_static = "1.4"
constriction = "0.3"
rustfft = "6.2"
probability = "0.20"
walkdir = "2.3"
blake3 = "1.5"
pyo3 = { version = "0.22", optional = true, features = ["abi3-py38", "extension-module"] }
