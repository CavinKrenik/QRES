[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "qres"
version = "15.2.0"
description = "QRES: Quantum-Relational Encoding System for Python"
requires-python = ">=3.8"
dependencies = [
    "numpy", 
    "pandas",
    "networkx",
    "gymnasium",
    "qutip",
    "scipy",
    "torch",
    "sentence-transformers",
    "open-clip-torch",
    "pillow",
    "scikit-learn",
    "matplotlib",
    "safetensors",
    "transformers",
    "stable-baselines3",
    "shimmy",
]
readme = "README.md"
authors = [{name = "Cavin Krenik"}]


[tool.maturin]
# Point to qres_core crate (after workspace split)
manifest-path = "qres_rust/qres_core/Cargo.toml"
# Point to the Python wrapper we moved to root
python-source = "python"
module-name = "qres.qres_rust"
features = ["python"]

# Start with a clean slate by ignoring old artifacts
[tool.maturin.sdist]
include = ["qres_rust/**/*", "python/**/*", "README.md", "pyproject.toml"]
exclude = ["legacy/**/*", "tests/data/**/*"]
